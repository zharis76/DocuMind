<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat with PDF</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }
  
  .header { padding: 16px 24px; border-bottom: 1px solid #2d2d4e; display: flex; align-items: center; gap: 12px; }
  .header h1 { font-size: 18px; font-weight: 600; color: #fff; }
  .upload-btn { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .upload-btn input { display: none; }
  .upload-btn label { background: #4f46e5; color: #fff; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .upload-btn label:hover { background: #4338ca; }
  #status { font-size: 13px; color: #818cf8; }

  .chat { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .empty { margin: auto; text-align: center; color: #4a4a6a; }
  .empty p { margin-top: 8px; font-size: 14px; }

  .msg { max-width: 720px; width: 100%; }
  .msg.user { align-self: flex-end; }
  .msg.user .bubble { background: #4f46e5; color: #fff; border-radius: 18px 18px 4px 18px; }
  .msg.bot .bubble { background: #16213e; border: 1px solid #2d2d4e; border-radius: 18px 18px 18px 4px; }
  .bubble { padding: 12px 16px; font-size: 15px; line-height: 1.6; white-space: pre-wrap; }
  .sources { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .src { font-size: 12px; color: #6b7280; border-left: 2px solid #2d2d4e; padding-left: 10px; }

  .input-row { padding: 16px 24px 24px; border-top: 1px solid #2d2d4e; display: flex; gap: 10px; max-width: 800px; width: 100%; margin: 0 auto; }
  .input-row input { flex: 1; background: #16213e; border: 1px solid #2d2d4e; border-radius: 12px; padding: 12px 16px; color: #e0e0e0; font-size: 15px; outline: none; }
  .input-row input:focus { border-color: #4f46e5; }
  .input-row button { background: #4f46e5; color: #fff; border: none; border-radius: 12px; padding: 12px 20px; cursor: pointer; font-size: 15px; }
  .input-row button:hover { background: #4338ca; }
  .input-row button:disabled { opacity: 0.5; cursor: default; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2d2d4e; border-radius: 3px; }
</style>
</head>
<body>

<div class="header">
  <h1>📄 Chat with PDF</h1>
  <div class="upload-btn">
    <span id="status">No document loaded</span>
    <label>Upload PDF <input type="file" id="file" accept=".pdf" onchange="upload()"></label>
  </div>
</div>

<div class="chat" id="chat">
  <div class="empty" id="empty">
    <div style="font-size:48px">📄</div>
    <p>Upload a PDF to get started.<br>Ask any question and get cited answers.</p>
  </div>
</div>

<div class="input-row">
  <input id="q" type="text" placeholder="Ask a question about your document..." onkeydown="if(event.key==='Enter')ask()">
  <button id="send" onclick="ask()">Ask</button>
</div>

<script>
const chat = document.getElementById('chat');

async function upload() {
  const file = document.getElementById('file').files[0];
  if (!file) return;
  document.getElementById('status').textContent = 'Indexing…';
  const fd = new FormData();
  fd.append('file', file);
  const r = await fetch('/api/upload', { method: 'POST', body: fd });
  const d = await r.json();
  document.getElementById('status').textContent = `${file.name} — ${d.chunks} chunks`;
}

function addMsg(cls, html) {
  const empty = document.getElementById('empty');
  if (empty) empty.remove();
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.innerHTML = `<div class="bubble">${html}</div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div.querySelector('.bubble');
}

async function ask() {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  document.getElementById('q').value = '';
  document.getElementById('send').disabled = true;

  addMsg('user', q);
  const thinking = addMsg('bot', 'Thinking…');

  const r = await fetch('/api/ask', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ question: q })
  });
  const d = await r.json();

  let sourcesHtml = '<div class="sources">';
  d.sources.forEach((s, i) => {
    sourcesHtml += `<div class="src"><b>[${i+1}] Page ${s.page}</b> — ${s.text.slice(0, 150)}…</div>`;
  });
  sourcesHtml += '</div>';

  thinking.innerHTML = d.answer.replace(/\n/g, '<br>') + sourcesHtml;
  document.getElementById('send').disabled = false;
  chat.scrollTop = chat.scrollHeight;
}
</script>
</body>
</html>
